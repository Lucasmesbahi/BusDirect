<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BusDirect - Gestion des réservations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 font-['Inter',sans-serif] text-slate-700">

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3">
      <div class="flex items-center gap-3">
        <img src="img/logo.png" alt="BusDirect" class="h-16 w-auto sm:h-20">
        <p class="border-l border-slate-200 pl-3 text-sm text-slate-500">Gestion des réservations</p>
      </div>
      </div>
      <div class="rounded-lg border border-slate-200 px-4 py-2 text-sm">
        <span class="text-slate-500">Trajet :</span>
        <span class="font-semibold text-[#0B2545]">Safi → Marrakech</span>
      </div>
    </div>
    </header>


<main class="mx-auto max-w-6xl px-4 py-6">
  <div class="grid gap-6 lg:grid-cols-[1fr_340px]">

    <section class="rounded-2xl border border-slate-200 bg-white p-4 sm:p-6">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-lg font-bold text-[#0B2545]">Plan du bus</h2>

        <div class="flex gap-4 text-xs text-slate-600">
          <span class="flex items-center gap-1.5">
            <span class="h-3 w-3 rounded-full bg-green-500"></span>
            Libre
          </span>

          <span class="flex items-center gap-1.5">
            <span class="h-3 w-3 rounded-full bg-red-500"></span>
            Occupé
          </span>
        </div>
      </div>

      <div class="mx-auto max-w-md rounded-3xl border-2 border-slate-200 bg-slate-50 p-3 sm:p-5">
      </div>
    </section>

    <div class="flex flex-col gap-6">
        <section class="rounded-2xl border border-slate-200 bg-white p-5">
          <h2 class="text-base font-bold text-[#0B2545]">Réserver</h2>
          <p class="mb-4 text-xs text-slate-500">Ajoutez un nouveau passager au trajet.</p>
          <label for="reserver-nom" class="mb-1 block text-sm font-medium">Nom du passager</label>
          <input id="reserver-nom" type="text" placeholder="Ex. Fatima Zahra" class="mb-4 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-[#F59E0B] focus:outline-none">
          <label for="reserver-siege" class="mb-1 block text-sm font-medium">Numéro du siège</label>
          <select id="reserver-siege" class="mb-5 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-[#F59E0B] focus:outline-none">
            <option>Attribution automatique</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
            <option>14</option>
            <option>15</option>
            <option>16</option>
            <option>17</option>
            <option>18</option>
            <option>19</option>
            <option>20</option>
          </select>
          <button type="button" class="w-full rounded-lg bg-[#0B2545] px-4 py-2.5 text-sm font-semibold text-white hover:bg-[#13396b]">Réserver</button>
        </section>
    </div>
        <section class="rounded-2xl border border-slate-200 bg-white p-5">
          <h2 class="text-base font-bold text-[#0B2545]">Modifier</h2>
          <p class="mb-4 text-xs text-slate-500">Changez le nom ou la place d'un passager.</p>
          <label for="modifier-reservation" class="mb-1 block text-sm font-medium">Réservation</label>
          <select id="modifier-reservation" class="mb-4 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-[#F59E0B] focus:outline-none">
            <option>Sélectionner un passager</option>
            <option>Siège 2 - Salaheddine Mesbahi</option>
            <option>Siège 6 - Youssef </option>
            <option>Siège 9 - Imane </option>
            <option>Siège 14 - Omar </option>
            <option>Siège 19 - Lina </option>
          </select>
        <label for="modifier-nom" class="mb-1 block text-sm font-medium">Nom du passager</label>
        <input id="modifier-nom" type="text" placeholder="Nom du passager" class="mb-4 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-[#F59E0B] focus:outline-none">
        <label for="modifier-siege" class="mb-1 block text-sm font-medium">Nouveau siège</label>
        <select id="modifier-siege" class="mb-5 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-[#F59E0B] focus:outline-none">
            <option>Conserver la place actuelle</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
            <option>14</option>
            <option>15</option>
            <option>16</option>
            <option>17</option>
            <option>18</option>
            <option>19</option>
            <option>20</option>
            <button type="button" class="w-full rounded-lg border-2 border-[#0B2545] bg-white px-4 py-2.5 text-sm font-semibold text-[#0B2545] hover:bg-slate-50">Modifier</button>
        </section>

        <section class="rounded-2xl border border-slate-200 bg-white p-5">
          <h2 class="text-base font-bold text-[#0B2545]">Supprimer</h2>
          <p class="mb-4 text-xs text-slate-500">Libérez une place déjà réservée.</p>
          <label for="supprimer-reservation" class="mb-1 block text-sm font-medium">Réservation</label>
          <select id="supprimer-reservation" class="mb-5 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-[#F59E0B] ">
            <option>Sélectionner un passager</option>
            <option>Siège 2 - Salaheddine Mesbahi </option>
            <option>Siège 6 - Youssef </option>
            <option>Siège 9 - Imane </option>
            <option>Siège 14 - Omar </option>
            <option>Siège 19 - Lina </option>
          </select>
          <button type="button" class="w-full rounded-lg border-2 border-[#0B2545] bg-white px-4 py-2.5 text-sm font-semibold text-[#0B2545] hover:bg-slate-50">Modifier</button>
        </section>
  </div>
</main>
    <footer class="mt-8 bg-gray-900 px-6 py-5 text-center text-sm text-gray-300">
        © 2026 BusDirect - Gestion des réservations
    </footer>

</body>
</html>
